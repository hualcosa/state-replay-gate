[project]
name = "state-replay-gate"
version = "0.1.0"
description = "State Replay Gate demo: snapshot evals vs. action-time state checks for a refund agent."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.28",
    "rich>=13.9",
]

[project.scripts]
srg = "srg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srg"]

[tool.hatch.build.targets.sdist]
include = ["src/srg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
